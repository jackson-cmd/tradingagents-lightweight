[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "tradingagents-lightweight"
version = "0.1.0"
description = "A fast, cheap, momentum-first swing-trading agent: Finviz momentum screen, transparent rule engine, SEC/Benzinga news, 1:2 ATR orders and a backtester. Runs free without API keys."
dynamic = ["readme"]                       # README.md with absolute links for PyPI (hook below)
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TradingAgents-Lightweight contributors" }]
keywords = ["trading", "swing-trading", "momentum", "stock-screener", "backtesting", "finviz", "trading-agent",
            "llm", "algorithmic-trading", "paper-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "feedparser>=6.0",
    "finvizfinance>=1.0",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "anthropic>=0.34"]
alpaca = ["alpaca-py>=0.20"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jackson-cmd/tradingagents-lightweight"
Source = "https://github.com/jackson-cmd/tradingagents-lightweight"
Issues = "https://github.com/jackson-cmd/tradingagents-lightweight/issues"
Changelog = "https://github.com/jackson-cmd/tradingagents-lightweight/blob/main/CHANGELOG.md"

[project.scripts]
talite = "talite.cli:main"
# The same command under the package's own name, which is what `uvx tradingagents-lightweight` runs.
tradingagents-lightweight = "talite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["talite"]

# PyPI shows README.md without the repository around it, so relative links and images there become absolute.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src=")(?!https?:)'
replacement = '\1https://raw.githubusercontent.com/jackson-cmd/tradingagents-lightweight/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#'
replacement = '](https://github.com/jackson-cmd/tradingagents-lightweight#'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?:|mailto:)'
replacement = '](https://github.com/jackson-cmd/tradingagents-lightweight/blob/main/'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: needs the internet (run with -m network)"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]           # pinned, so a newer ruff with more default rules does not fail CI

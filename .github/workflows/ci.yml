name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run only on pull requests: on main every run must finish, because the release workflow
# waits for CI to succeed on the merge commit and a cancelled run would skip that version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (offline)
        run: pytest

  package:
    # Build the wheel and start it from a clean install, the way PyPI users get it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a fresh venv and start it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/talite" --version
          "$RUNNER_TEMP/venv/bin/tradingagents-lightweight" --help

  image:
    # The release pushes this image; building it on every pull request shows a broken Dockerfile here first.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and start it
        run: |
          docker build -t talite-check .
          docker run --rm talite-check --version
